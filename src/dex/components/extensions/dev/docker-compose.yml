services:
  dex:
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    configs:
      - source: dex-config
        target: /etc/dex/config.yaml
configs:
  dex-config:
    content: |
      issuer: ${DEX_ISSUER}

      storage:
        type: sqlite3
        config:
          file: /var/dex/dex.db

      web:
        http: 0.0.0.0:5556

      oauth2:
        responseTypes:
          - code
        skipApprovalScreen: true

      staticClients:
        - id: o2-client
          redirectURIs:
            - ${DEX_O2_CLIENT_REDIRECT_URL}
          name: ${DEX_O2_CLIENT_NAME}
          secret: ${DEX_O2_CLIENT_SECRET}

      connectors:
        - type: mockCallback
          id: mock
          name: Mock
          enablePasswordDB: true

      enablePasswordDB: true
      staticPasswords:
      - email: "admin@example.com"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: "admin"
        name: "Admin User"
        emailVerified: true
        preferredUsername: "admin"
        groups:
        - "admin"
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"

      signer:
        type: local
        config:
          keysRotationPeriod: "6h"
          algorithm: "RS256"
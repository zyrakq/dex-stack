x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"

services:
  dex:
    image: ${IMAGE:-dexidp/dex:latest}
    container_name: dex
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - dex-data:/var/dex

volumes:
  dex-data:
    name: dex-data